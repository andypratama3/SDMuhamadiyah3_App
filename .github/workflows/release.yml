name: Release Android

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Firebase config (CI placeholder)
        run: cp androidApp/google-services.json.example androidApp/google-services.json

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release AAB (Play Store)
        run: |
          ./gradlew :androidApp:bundleRelease \
            -PRELEASE_STORE_FILE="${RELEASE_STORE_FILE:-}" \
            -PRELEASE_STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-}" \
            -PRELEASE_KEY_ALIAS="${RELEASE_KEY_ALIAS:-}" \
            -PRELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-}" \
            --stacktrace

      - name: Build release APK
        run: |
          ./gradlew :androidApp:assembleRelease \
            -PRELEASE_STORE_FILE="${RELEASE_STORE_FILE:-}" \
            -PRELEASE_STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-}" \
            -PRELEASE_KEY_ALIAS="${RELEASE_KEY_ALIAS:-}" \
            -PRELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-}" \
            --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/androidApp-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            androidApp/build/outputs/bundle/release/androidApp-release.aab
            androidApp/build/outputs/apk/release/androidApp-release.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
